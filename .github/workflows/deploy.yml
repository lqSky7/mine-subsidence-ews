name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_BACKEND_URL: http://35.154.233.23/api/v1
          NEXT_PUBLIC_SOCKET_URL: http://35.154.233.23
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'ce4a9c0f2213214ebcad881d6a601f74' }}
        run: |
          npx wrangler pages deploy out --project-name="${{ secrets.CLOUDFLARE_PROJECT_NAME || 'mine-iot' }}" --branch=main || \
          npx wrangler pages deploy out --project-name="mine-subsidence-ews" --branch=main
